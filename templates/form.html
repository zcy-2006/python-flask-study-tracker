{% extends "base.html" %}

{% block title %}{{ page_title }} | 学习打卡{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="mb-4">
            <h1 class="h3 mb-1">{{ page_title }}</h1>
            <p class="text-secondary mb-0">带 * 的项目是必填项。</p>
        </div>

        <form class="card border-0 shadow-sm" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="card-body p-4">
                <div class="mb-3">
                    <label class="form-label" for="title">学习内容 *</label>
                    <input class="form-control" id="title" name="title" type="text" maxlength="100" required value="{{ record.title }}" placeholder="例如：Flask 路由与请求">
                </div>

                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="subject">学习科目</label>
                        <input class="form-control" id="subject" name="subject" type="text" maxlength="50" value="{{ record.subject }}" placeholder="例如：Python Web">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="duration_minutes">学习时长（分钟）*</label>
                        <input class="form-control" id="duration_minutes" name="duration_minutes" type="number" min="1" max="1440" required value="{{ record.duration_minutes }}">
                    </div>
                </div>

                <div class="my-3">
                    <label class="form-label" for="study_date">学习日期 *</label>
                    <input class="form-control" id="study_date" name="study_date" type="date" required value="{{ record.study_date }}">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="notes">学习笔记</label>
                    <textarea class="form-control" id="notes" name="notes" rows="4" maxlength="500" placeholder="记录今天学到的重点、问题或下一步计划。">{{ record.notes }}</textarea>
                </div>

                <div class="form-check">
                    <input class="form-check-input" id="completed" name="completed" type="checkbox" value="1" {% if record.completed %}checked{% endif %}>
                    <label class="form-check-label" for="completed">这条学习任务已经完成</label>
                </div>
            </div>
            <div class="card-footer bg-white d-flex justify-content-end gap-2 p-3">
                <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">取消</a>
                <button class="btn btn-primary" type="submit">{{ submit_label }}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
