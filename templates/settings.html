{% extends "base.html" %}

{% block title %}目标设置 | 学习打卡{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="mb-4">
            <h1 class="h3 mb-1">学习目标设置</h1>
            <p class="text-secondary mb-0">设置每日和每周目标，首页会显示完成进度。</p>
        </div>

        <form class="card border-0 shadow-sm" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="card-body p-4">
                <div class="mb-4">
                    <label class="form-label" for="daily_goal_minutes">每日学习目标（分钟）</label>
                    <input class="form-control" id="daily_goal_minutes" name="daily_goal_minutes" type="number" min="1" max="1440" required value="{{ settings.daily_goal_minutes }}">
                    <div class="form-text">例如每天学习 60 分钟。</div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="weekly_goal_minutes">每周学习目标（分钟）</label>
                    <input class="form-control" id="weekly_goal_minutes" name="weekly_goal_minutes" type="number" min="1" max="10080" required value="{{ settings.weekly_goal_minutes }}">
                    <div class="form-text">例如一周累计学习 300 分钟，即 5 小时。</div>
                </div>
            </div>
            <div class="card-footer bg-white d-flex justify-content-end gap-2 p-3">
                <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">返回首页</a>
                <button class="btn btn-primary" type="submit">保存目标</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
