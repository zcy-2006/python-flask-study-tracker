{% extends "base.html" %}

{% block title %}账户管理 | 学习打卡{% endblock %}

{% block content %}
<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
    <div>
        <h1 class="h3 mb-1">账户管理</h1>
        <p class="text-secondary mb-0">查看账户信息并定期更新密码。</p>
    </div>
    <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">返回首页</a>
</div>

<div class="row g-3 mb-4">
    <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
                <p class="text-secondary mb-1">用户名</p>
                <p class="h4 mb-0">{{ account.username }}</p>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-4">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
                <p class="text-secondary mb-1">学习记录</p>
                <p class="h4 mb-0">{{ account_stats.total_records }}</p>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-4">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
                <p class="text-secondary mb-1">累计时长</p>
                <p class="h4 mb-0">{{ account_stats.total_minutes }} 分钟</p>
            </div>
        </div>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <form class="card border-0 shadow-sm" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="card-header bg-white p-4 pb-0 border-0">
                <h2 class="h5 mb-1">修改密码</h2>
                <p class="text-secondary small mb-0">修改后请使用新密码重新登录。</p>
            </div>
            <div class="card-body p-4">
                <div class="mb-3">
                    <label class="form-label" for="current_password">当前密码</label>
                    <input class="form-control" id="current_password" name="current_password" type="password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="new_password">新密码</label>
                    <input class="form-control" id="new_password" name="new_password" type="password" minlength="8" maxlength="128" required>
                    <div class="form-text">至少 8 个字符，并且不能与当前密码相同。</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirm_password">确认新密码</label>
                    <input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="8" maxlength="128" required>
                </div>
            </div>
            <div class="card-footer bg-white d-flex justify-content-end p-3">
                <button class="btn btn-primary" type="submit">更新密码</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
